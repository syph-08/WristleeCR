<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tracker de compras</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <h1>Lista de Compras</h1>

  <form id="productForm">
    <input type="text" id="product" placeholder="Producto" required>
    <input type="number" id="price" placeholder="Precio" step="0.01" required>
    <button type="submit">Agregar</button>
  </form>

  <ul id="productList"></ul>

  <div class="totals">
    <div id="totalPrice">Total: ₡0.00</div>
    <div id="expectedPrice">Expectado: ₡0.00</div>
  </div>

  <button class="clear-btn" onclick="clearData()">Eliminar <span style="font-weight: bold;">Todo</span></button>

  <script src="script.js"></script>
</body>
</html>
